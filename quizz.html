<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="quizz.css">
    <link rel="shortcut icon" href="quizz.jpg" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini quizz</title>
</head>
<body>
    <!--  Ecran d'accueil  -->
    <div id="accueil">
        <h1>Quiz Educatif</h1>
        <p>Teste tes connaissances !</p>
        <button onclick="startQuiz()">Commencer</button>
    </div>

    <!--  Ecran de jeu  -->
    <div id="quiz">
        <h2 id="question"></h2>
        <div id="options"></div>
        <p id="progression"></p>
        <p id="timer"><!--Temps restant : <span id="time">10</span> s--></p>
    </div>

    <!--  Ecran de résultat  -->
    <div id="resultat">
        <h2>Résultat du Quiz</h2>
        <p id="score"></p>
        <p id="bestScore"></p>
        <button onclick="restartQuiz()">Rejouer</button>
    </div>

    <script src="quizz.js"></script>
</body>
</html>
